<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<title>健身数据</title>
<link rel="stylesheet" href="css/fitness.css">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.x.x/dist/chart.umd.min.js"></script>
<style>
/* Base Reset & Tab Transitions */
[x-cloak] { display: none !important; }
body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
.tab-content { position: relative; overflow: hidden; }
.tab-content > [x-show] { position: relative; }
</style>
</head>
<body>
<div id="fitness-app" x-cloak x-data="fitnessApp()" x-init="init()" @touchstart.passive="ptrTouchStart($event)" @touchmove.passive="ptrTouchMove($event)" @touchend="ptrTouchEnd($event)">

  <!-- Non-blocking Toast Banner -->
  <div class="toast-banner" x-show="toastMessage" x-transition.opacity.duration.300ms style="display:none">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span x-text="toastMessage"></span>
  </div>

  <!-- Skeleton Loading Screen -->
  <div class="skeleton-container" x-show="loading">
    <div class="skeleton-header"></div>
    <div class="skeleton-grid">
      <div class="sk-box" style="animation-delay:0s"></div><div class="sk-box" style="animation-delay:0.05s"></div><div class="sk-box" style="animation-delay:0.1s"></div><div class="sk-box" style="animation-delay:0.15s"></div><div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div>
      <div class="sk-box" style="animation-delay:0.05s"></div><div class="sk-box" style="animation-delay:0.1s"></div><div class="sk-box" style="animation-delay:0.15s"></div><div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div><div class="sk-box" style="animation-delay:0.35s"></div>
      <div class="sk-box" style="animation-delay:0.1s"></div><div class="sk-box" style="animation-delay:0.15s"></div><div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div><div class="sk-box" style="animation-delay:0.35s"></div><div class="sk-box" style="animation-delay:0.4s"></div>
      <div class="sk-box" style="animation-delay:0.15s"></div><div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div><div class="sk-box" style="animation-delay:0.35s"></div><div class="sk-box" style="animation-delay:0.4s"></div><div class="sk-box" style="animation-delay:0.45s"></div>
      <div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div><div class="sk-box" style="animation-delay:0.35s"></div><div class="sk-box" style="animation-delay:0.4s"></div><div class="sk-box" style="animation-delay:0.45s"></div><div class="sk-box" style="animation-delay:0.5s"></div>
    </div>
    <div class="skeleton-bar"></div>
    <div class="skeleton-bar short"></div>
  </div>

  <!-- Error State -->
  <div x-show="error" style="text-align:center;padding:60px 20px;color:var(--accent-red)">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <p style="margin:0 0 16px 0;font-size:1rem;color:var(--text-primary);font-weight:600">数据加载失败</p>
    <p><button @click="init()" class="refresh-pill-btn" style="padding:8px 24px;font-size:0.88rem">重试</button></p>
  </div>

  <div x-show="!loading && !error" style="display:none">

    <!-- Pull-to-refresh indicator -->
    <div class="ptr-indicator" :class="{ 'ptr-active': _ptrPulling, 'ptr-refreshing': _ptrRefreshing }" :style="'height:'+(_ptrDistance>0?_ptrDistance:0)+'px'">
      <div class="ptr-content" style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.8rem">
        <svg x-show="!_ptrRefreshing && _ptrDistance >= 60" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M20.5 15a9 9 0 0 1-14.8 3.4L1 14"/></svg>
        <span x-show="!_ptrRefreshing && _ptrDistance >= 60">释放立即刷新</span>
        <svg x-show="!_ptrRefreshing && _ptrDistance < 60" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        <span x-show="!_ptrRefreshing && _ptrDistance < 60">下拉刷新</span>
        <span x-show="_ptrRefreshing" class="ptr-spinner"></span>
        <span x-show="_ptrRefreshing">刷新中...</span>
      </div>
    </div>

    <!-- Apple-style Top Bar -->
    <div class="top-bar">
      <div class="top-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 16v-3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="brand-title">健身看板</span>
      </div>
      <div class="top-center-status">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span x-text="'更新于 ' + lastUpdated"></span>
      </div>
      <div class="top-actions">
        <button type="button" class="theme-toggle-btn" @click="cycleTheme()" :title="'当前：' + (themeMode==='auto' ? '跟随系统' : themeMode==='dark' ? '暗夜模式' : '浅色模式')">
          <template x-if="themeMode === 'auto'">
            <span style="display:inline-flex;align-items:center;gap:4px">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              <span>系统</span>
            </span>
          </template>
          <template x-if="themeMode === 'dark'">
            <span style="display:inline-flex;align-items:center;gap:4px">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span>暗夜</span>
            </span>
          </template>
          <template x-if="themeMode === 'light'">
            <span style="display:inline-flex;align-items:center;gap:4px">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <span>浅色</span>
            </span>
          </template>
        </button>
        <button class="refresh-pill-btn" @click="refreshData()" aria-label="刷新数据">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M20.5 15a9 9 0 0 1-14.8 3.4L1 14"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </div>

    <!-- Month & Year Navigation -->
    <div class="month-nav" x-show="activeTab === 'calendar' || activeTab === 'heatmap'">
      <button @click="activeTab === 'calendar' ? prevMonth() : prevYear()" :aria-label="activeTab === 'calendar' ? '上一月' : '上一年'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="month-display">
        <span x-text="activeTab === 'calendar' ? currentMonthDisplay : currentYearDisplay"></span>
        <button class="today-badge" x-show="activeTab === 'calendar' && !isCurrentMonth" @click="goToToday()">今天</button>
      </div>
      <button @click="activeTab === 'calendar' ? nextMonth() : nextYear()" :aria-label="activeTab === 'calendar' ? '下一月' : '下一年'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- Tab Contents -->
    <div class="tab-content">

      <!-- Calendar Tab -->
      <div x-show="activeTab === 'calendar'" class="calendar-container">
        <div class="weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="days-grid">
          <template x-for="(day, i) in calendarDays" :key="i">
            <div class="day-cell" 
                 :class="{today: day.isToday, 'has-data': day.data, 'has-training': day.data && day.data.has_training, empty: !day.date}" 
                 :role="day.data ? 'button' : null"
                 :tabindex="day.data ? 0 : -1"
                 :aria-label="day.date ? (day.date + (day.data && day.data.has_training ? ' 训练：' + day.data.body_parts.join('/') : ' 无训练记录')) : null"
                 @click="if(day.data) openDetail(day.data)"
                 @keydown.enter="if(day.data) openDetail(day.data)"
                 @keydown.space.prevent="if(day.data) openDetail(day.data)">
              <span class="day-number" x-text="day.dayNumber"></span>
              <template x-if="day.data && day.data.has_training">
                <div class="dots-container">
                  <template x-for="part in day.data.body_parts" :key="part">
                    <span class="dot" :class="getPartClass(part)"></span>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- Heatmap Tab -->
      <div x-show="activeTab === 'heatmap'" class="heatmap-container">
        <h3 class="section-heading">年度训练热力图</h3>
        <div class="chart-card">
          <div class="heatmap-scroll">
            <template x-if="heatmapData && heatmapData.weeks && heatmapData.weeks.length">
              <div class="heatmap-canvas-wrap">
                <!-- Month Labels Header -->
                <div class="heatmap-month-header">
                  <div class="heatmap-weekday-spacer"></div>
                  <div class="heatmap-months-labels">
                    <template x-for="m in heatmapData.months" :key="m.name">
                      <span class="heatmap-month-tag" :style="'left: ' + ((m.col - 1) * 18) + 'px'" x-text="m.name"></span>
                    </template>
                  </div>
                </div>

                <!-- Heatmap Body (Weekdays + Weekly Columns) -->
                <div class="heatmap-body">
                  <div class="heatmap-weekdays">
                    <span>一</span>
                    <span></span>
                    <span>三</span>
                    <span></span>
                    <span>五</span>
                    <span></span>
                    <span>日</span>
                  </div>

                  <div class="heatmap-weeks-track">
                    <template x-for="w in heatmapData.weeks" :key="w.weekIndex">
                      <div class="heatmap-col">
                        <template x-for="d in w.days" :key="d.date">
                          <div class="heatmap-cell"
                               :class="['level-' + d.level, d.isToday ? 'is-today' : '', !d.inRange ? 'out-range' : '']"
                               :title="d.tooltip"
                               :aria-label="d.tooltip"
                               :role="d.hasTraining ? 'button' : null"
                               :tabindex="d.hasTraining ? 0 : -1"
                               @click="if(d.hasTraining) openHeatmapDetail(d.date, d.level)"
                               @keydown.enter="if(d.hasTraining) openHeatmapDetail(d.date, d.level)"
                               @keydown.space.prevent="if(d.hasTraining) openHeatmapDetail(d.date, d.level)">
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>
            <template x-if="!heatmapData || !heatmapData.weeks || !heatmapData.weeks.length">
              <div style="text-align:center;padding:36px;color:var(--text-muted);font-size:0.85rem">该年份暂无训练记录</div>
            </template>
          </div>

          <!-- Heatmap Legend -->
          <div class="heatmap-legend">
            <span class="legend-title">图例：</span>
            <div class="legend-item"><div class="heatmap-cell level-0"></div><span>休息</span></div>
            <div class="legend-item"><div class="heatmap-cell level-1"></div><span>1-2部位</span></div>
            <div class="legend-item"><div class="heatmap-cell level-2"></div><span>3+部位</span></div>
          </div>
        </div>

        <!-- Heatmap Key Statistics Summary Grid -->
        <template x-if="heatmapData && heatmapData.stats && heatmapData.stats.total > 0">
          <div class="heatmap-stats-bar">
            <div class="stat-card">
              <span class="stat-label">累计打卡</span>
              <div class="stat-value"><b x-text="heatmapData.stats.total"></b><span class="stat-unit">天</span></div>
            </div>
            <div class="stat-card">
              <span class="stat-label">打卡频率</span>
              <div class="stat-value"><b x-text="heatmapData.stats.pct"></b><span class="stat-unit">%</span></div>
            </div>
            <div class="stat-card">
              <span class="stat-label">记录周期</span>
              <div class="stat-value"><b x-text="heatmapData.stats.recorded"></b><span class="stat-unit">天</span></div>
            </div>
            <div class="stat-card">
              <span class="stat-label">训练最高峰</span>
              <div class="stat-value stat-sub-text"><b x-text="heatmapData.stats.peakMonth"></b></div>
            </div>
          </div>
        </template>

        <!-- Monthly Breakdown Density List -->
        <template x-if="heatmapData && heatmapData.monthlyBreakdown && heatmapData.monthlyBreakdown.length">
          <div class="monthly-breakdown-card">
            <h4 class="card-sub-heading">月度训练密度分析</h4>
            <div class="monthly-bars-list">
              <template x-for="mb in heatmapData.monthlyBreakdown" :key="mb.name">
                <div class="monthly-bar-item">
                  <div class="monthly-bar-header">
                    <span class="monthly-name" x-text="mb.name"></span>
                    <span class="monthly-count"><b x-text="mb.trained"></b> / <span x-text="mb.total + '天'"></span> (<span x-text="mb.rate + '%'"></span>)</span>
                  </div>
                  <div class="monthly-progress-track">
                    <div class="monthly-progress-fill" :style="'width: ' + mb.rate + '%'"></div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Weight Tab -->
      <div x-show="activeTab === 'weight'" class="weight-container">
        <h3 class="section-heading">体重趋势</h3>
        <div class="chart-card">
          <div class="chart-wrapper"><canvas id="weightChart"></canvas></div>
        </div>
        <div class="weight-summary" x-show="weightStats">
          <div class="stat-box"><span>最新</span><b x-text="weightStats?.latest"></b>kg</div>
          <div class="stat-box"><span>起始</span><b x-text="weightStats?.start"></b>kg</div>
          <div class="stat-box"><span>最高</span><b x-text="weightStats?.max"></b>kg</div>
        </div>
      </div>

      <!-- Stats Tab -->
      <div x-show="activeTab === 'stats'" class="stats-container">
        <div class="stats-grid-desktop">
          <div class="chart-card">
            <h3 class="section-heading">训练部位分布</h3>
            <div class="chart-wrapper donut-wrapper"><canvas id="pieChart"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 class="section-heading">每周训练天数</h3>
            <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Sheet Detail -->
    <div class="bottom-sheet-backdrop" x-show="showDetail" @click="closeDetail()" style="display:none"></div>
    <div class="bottom-sheet" :class="{open: showDetail}" @touchstart="touchStart($event)" @touchmove="touchMove($event)" @touchend="touchEnd($event)">
      <div class="sheet-top-bar">
        <div class="sheet-handle" @click="closeDetail()"></div>
        <button class="sheet-close-btn" @click="closeDetail()" aria-label="关闭详情">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <template x-if="selectedDay">
        <div class="sheet-content">
          <!-- Sheet Header Area -->
          <div class="sheet-header-area">
            <h3 class="sheet-title" x-text="selectedDay.date"></h3>
            <div class="sheet-meta-pills">
              <span class="meta-chip" x-text="selectedDay.weekday"></span>
              <template x-if="selectedDay.weight_kg">
                <span class="meta-chip chip-accent">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                  <span x-text="selectedDay.weight_kg + ' kg'"></span>
                </span>
              </template>
              <template x-if="selectedDay.body_parts && selectedDay.body_parts.length">
                <span class="meta-chip chip-accent" x-text="'练 ' + selectedDay.body_parts.join('/')"></span>
              </template>
              <template x-if="!selectedDay.has_training">
                <span class="meta-chip">今日休息</span>
              </template>
            </div>
          </div>

          <div class="sheet-split-layout">
            <div class="sheet-left-col">
              <!-- Exercise Action Cards -->
              <div class="exercise-list" x-show="selectedDay.exercises && selectedDay.exercises.length">
                <template x-for="ex in selectedDay.exercises" :key="ex.name">
                  <div class="ex-card">
                    <div class="ex-card-top">
                      <span class="ex-card-title" x-text="ex.name"></span>
                      <span class="ex-card-sets" x-text="ex.sets + ' 组'"></span>
                    </div>
                    <div class="ex-card-bottom">
                      <span class="ex-card-details" x-text="ex.weight_display"></span>
                      <div class="ex-card-muscles" x-show="ex.muscles && ex.muscles.length">
                        <template x-for="m in ex.muscles" :key="m">
                          <span class="muscle-tag" x-text="m"></span>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>
              </div>

              <!-- Diet Card -->
              <div class="diet-card" x-show="selectedDay.diet">
                <div class="diet-card-header">
                  <div>
                    <span style="font-size:0.72rem;color:var(--text-muted);display:block;margin-bottom:2px">摄入热量</span>
                    <span class="diet-kcal-big" x-text="selectedDay.diet.total_kcal"></span>
                    <span style="font-size:0.8rem;color:var(--text-secondary);margin-left:2px">kcal</span>
                  </div>
                  
                  <!-- Verdict Chip -->
                  <div x-show="fitnessData.profile" class="diet-verdict-chip"
                       :style="'background:' + (getDietVerdict(selectedDay).bg || 'rgba(255,255,255,0.06)') + '; color:' + (getDietVerdict(selectedDay).color || 'var(--text-secondary)')">
                    <template x-if="getDietVerdict(selectedDay).icon === 'check'">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </template>
                    <template x-if="getDietVerdict(selectedDay).icon === 'x'">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    </template>
                    <template x-if="getDietVerdict(selectedDay).icon === 'alert'">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    </template>
                    <span x-text="getDietVerdict(selectedDay).text"></span>
                  </div>
                </div>

                <!-- Macro Segmented Bar -->
                <div class="macro-progress-track" x-show="selectedDayMacros">
                  <div class="macro-seg-carbs" :style="'width:' + selectedDayMacros?.carbsPct + '%'" :title="'碳水: ' + selectedDayMacros?.carbsPct + '%'"></div>
                  <div class="macro-seg-protein" :style="'width:' + selectedDayMacros?.proteinPct + '%'" :title="'蛋白质: ' + selectedDayMacros?.proteinPct + '%'"></div>
                  <div class="macro-seg-fat" :style="'width:' + selectedDayMacros?.fatPct + '%'" :title="'脂肪: ' + selectedDayMacros?.fatPct + '%'"></div>
                </div>

                <!-- Macro Stats Row -->
                <div class="macro-stats-row">
                  <div class="macro-box">
                    <span class="macro-box-title">碳水</span>
                    <span class="macro-box-val" style="color:var(--accent-cyan)" x-text="(selectedDay.diet.carbs_g != null ? selectedDay.diet.carbs_g : '—') + 'g'"></span>
                  </div>
                  <div class="macro-box">
                    <span class="macro-box-title">蛋白质</span>
                    <span class="macro-box-val" style="color:var(--accent)" x-text="(selectedDay.diet.protein_g != null ? selectedDay.diet.protein_g : '—') + 'g'"></span>
                  </div>
                  <div class="macro-box">
                    <span class="macro-box-title">脂肪</span>
                    <span class="macro-box-val" style="color:var(--accent-amber)" x-text="(selectedDay.diet.fat_g != null ? selectedDay.diet.fat_g : '—') + 'g'"></span>
                  </div>
                </div>

                <!-- Calorie Target Diff -->
                <div x-show="selectedDayDietDiff !== null" style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:0.8rem">
                  <span style="color:var(--text-muted)">与目标对比</span>
                  <span :style="'font-weight:600;color:' + (selectedDayDietDiff > 0 ? '#f43f5e' : selectedDayDietDiff < 0 ? '#10b981' : 'var(--text-secondary)')"
                        x-text="selectedDayDietDiff === 0 ? '目标达成 0 kcal' : (selectedDayDietDiff > 0 ? '+' : '') + selectedDayDietDiff + ' kcal'"></span>
                </div>
              </div>
            </div>

            <div class="sheet-right-col">
              <!-- Muscle Diagram Toggle -->
              <div class="muscle-view-toggle" x-show="selectedDay.exercises && selectedDay.exercises.length">
                <button class="muscle-btn" @click="toggleMuscleSVG()">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 4h3a2 2 0 0 1 2 2v1"/><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M4 16v2a2 2 0 0 0 2 2h2"/><path d="M20 16h-3"/><circle cx="12" cy="12" r="3"/></svg>
                  <span>肌肉解剖图解</span>
                  <svg class="muscle-chevron" :class="{open: showMuscleSVG}" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
              </div>
              <div class="muscle-anatomy-wrapper" x-show="showMuscleSVG" style="display:none">
                <div class="muscle-toggle-bar">
                  <button type="button" class="muscle-toggle-btn" :class="{active: muscleViewSide === 'front'}" @click="setMuscleView('front')">正面 Front</button>
                  <button type="button" class="muscle-toggle-btn" :class="{active: muscleViewSide === 'back'}" @click="setMuscleView('back')">背面 Back</button>
                </div>
                <div class="muscle-svg-container" :class="'view-' + muscleViewSide" x-html="muscleSvgContent"></div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Floating Dock Bottom Nav -->
    <div class="bottom-nav" :style="showDetail ? 'pointer-events:none;opacity:0.3' : ''" role="navigation" aria-label="底栏主导航">
      <div class="dock-indicator" :class="{
        'pos-0': activeTab === 'calendar',
        'pos-1': activeTab === 'heatmap',
        'pos-2': activeTab === 'weight',
        'pos-3': activeTab === 'stats'
      }"></div>
      <button type="button" class="nav-item" :class="{active:activeTab==='calendar'}" @click="switchTab('calendar')" aria-label="日历" :aria-current="activeTab==='calendar'?'page':null">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>日历</span>
      </button>
      <button type="button" class="nav-item" :class="{active:activeTab==='heatmap'}" @click="switchTab('heatmap')" aria-label="热力" :aria-current="activeTab==='heatmap'?'page':null">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="15" width="4" height="8" rx="1"/><rect x="8" y="12" width="4" height="11" rx="1"/><rect x="15" y="7" width="4" height="16" rx="1"/></svg>
        <span>热力</span>
      </button>
      <button type="button" class="nav-item" :class="{active:activeTab==='weight'}" @click="switchTab('weight')" aria-label="体重" :aria-current="activeTab==='weight'?'page':null">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 17 9 11 13 15 21 7"/></svg>
        <span>体重</span>
      </button>
      <button type="button" class="nav-item" :class="{active:activeTab==='stats'}" @click="switchTab('stats')" aria-label="统计" :aria-current="activeTab==='stats'?'page':null">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><path d="M2 12h20"/></svg>
        <span>统计</span>
      </button>
    </div>

  </div>
</div>

<script>
window.fitnessApp = function(){
  return {
    activeTab: 'calendar',
    showDetail: false,
    selectedDay: null,
    currentDate: new Date(),
    calendarDays: [],
    fitnessData: null,
    showMuscleSVG: false,
    muscleSvgContent: '',
    muscleViewSide: 'front',
    weightChartInstance: null,
    pieChartInstance: null,
    barChartInstance: null,
    heatmapData: null,
    weightStats: null,
    loading: true,
    error: false,
    themeMode: (function(){ try { return localStorage.getItem('fitness_theme') || 'auto'; } catch(e){ return 'auto'; } })(),
    lastUpdated: '—',
    _touchStartY: 0,
    _ptrPulling: false,
    _ptrDistance: 0,
    _ptrRefreshing: false,
    _ptrStartY: 0,
    _svgCached: false,
    _weightAnimPlayed: false,
    _statsAnimPlayed: false,
    toastMessage: '',
    _toastTimer: null,
    _cacheVersion: '',

    cycleTheme(){
      const modes = ['auto', 'dark', 'light'];
      const next = modes[(modes.indexOf(this.themeMode) + 1) % modes.length];
      this.applyTheme(next);
      const label = next === 'auto' ? '跟随系统' : next === 'dark' ? '已开启暗夜模式' : '已开启浅色模式';
      this.showToast(label);
    },

    applyTheme(mode){
      this.themeMode = mode;
      try { localStorage.setItem('fitness_theme', mode); } catch(e){}
      if(mode === 'dark'){
        document.documentElement.setAttribute('data-theme', 'dark');
      } else if(mode === 'light'){
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      this.$nextTick(() => {
        this.updateChartThemes();
      });
    },

    showToast(msg){
      this.toastMessage = msg;
      if(this._toastTimer) clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(()=>{ this.toastMessage = ''; }, 3000);
    },

    _getDataUrl(){
      return 'data.json?v=' + encodeURIComponent(this._cacheVersion || String(Date.now()));
    },

    get selectedDayDietDiff(){
      if(!this.selectedDay || !this.selectedDay.diet || !this.fitnessData || !this.fitnessData.profile) return null;
      const target = this.fitnessData.profile.calorie_target;
      if(!target) return null;
      return this.selectedDay.diet.total_kcal - target;
    },

    get selectedDayMacros(){
      if(!this.selectedDay || !this.selectedDay.diet) return null;
      const carbs = Number(this.selectedDay.diet.carbs_g) || 0;
      const protein = Number(this.selectedDay.diet.protein_g) || 0;
      const fat = Number(this.selectedDay.diet.fat_g) || 0;
      const carbKcal = carbs * 4;
      const proKcal = protein * 4;
      const fatKcal = fat * 9;
      const total = carbKcal + proKcal + fatKcal;
      if(total <= 0) return { carbsPct: 33.3, proteinPct: 33.3, fatPct: 33.4 };
      return {
        carbsPct: Math.round((carbKcal / total) * 100),
        proteinPct: Math.round((proKcal / total) * 100),
        fatPct: Math.round((fatKcal / total) * 100)
      };
    },

    get currentMonthDisplay(){
      return this.currentDate.getFullYear() + '年 ' + (this.currentDate.getMonth() + 1) + '月';
    },

    get currentYearDisplay(){
      return this.currentDate.getFullYear() + '年';
    },

    get isCurrentMonth(){
      const now = new Date();
      return this.currentDate.getFullYear() === now.getFullYear() && this.currentDate.getMonth() === now.getMonth();
    },

    async init(){
      this.loading = true;
      this.error = false;
      try {
        const r = await fetch(this._getDataUrl());
        if(!r.ok) throw new Error('HTTP ' + r.status);
        this.fitnessData = await r.json();
      } catch(e) {
        this.error = true;
        this.loading = false;
        return;
      }

      if(this.fitnessData.meta && this.fitnessData.meta.generated_at){
        this._cacheVersion = this.fitnessData.meta.generated_at;
        const d = new Date(this.fitnessData.meta.generated_at);
        this.lastUpdated = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
      }
      this.loading = false;

      if(!this._svgCached){
        try {
          const s = await fetch('img/body-outline.svg');
          this.muscleSvgContent = await s.text();
          this._svgCached = true;
        } catch(e){}
      }

      this.applyTheme(this.themeMode);
      this.renderCalendar();
      this.computeHeatmap();
      this.computeWeightStats();

      // Visibility change power saving
      const self = this;
      if(!this._visHandler){
        this._visHandler = () => {
          if(document.hidden){
            if(self._refreshTimer){ clearInterval(self._refreshTimer); self._refreshTimer = null; }
          } else {
            self.refreshData();
            if(!self._refreshTimer) self._refreshTimer = setInterval(() => { self.refreshData(); }, 1800000);
          }
        };
        document.addEventListener('visibilitychange', this._visHandler);
      }

      // Theme change listener
      if(!this._themeHandler){
        this._themeHandler = () => {
          if(self.themeMode === 'auto') {
            self.applyTheme('auto');
          }
        };
        try {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', this._themeHandler);
        } catch(e){}
      }

      // Auto-refresh every 30 min
      if(this._refreshTimer) clearInterval(this._refreshTimer);
      this._refreshTimer = setInterval(() => { self.refreshData(); }, 1800000);

      // Debounced resize - only resize visible charts on active tab to prevent 0x0 canvas distortion
      if(!this._resizeHandler){
        let debounceTimer = null;
        this._resizeHandler = () => {
          if(debounceTimer) clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            if(self.activeTab === 'weight' && self.weightChartInstance) {
              self.weightChartInstance.resize();
            } else if(self.activeTab === 'stats') {
              if(self.pieChartInstance) self.pieChartInstance.resize();
              if(self.barChartInstance) self.barChartInstance.resize();
            }
          }, 150);
        };
        window.addEventListener('resize', this._resizeHandler);
      }
    },

    switchTab(t){
      if(this.activeTab === t) return;
      this.activeTab = t;
      this.$nextTick(() => {
        requestAnimationFrame(() => {
          if(this.activeTab === 'weight') this.renderWeightChart();
          else if(this.activeTab === 'stats') this.renderStatsCharts();
          else if(this.activeTab === 'heatmap') {
            const scroll = document.querySelector('.heatmap-scroll');
            if(scroll && scroll.scrollWidth > scroll.clientWidth) {
              scroll.scrollLeft = scroll.scrollWidth;
            }
          }
        });
      });
    },

    refreshData(){
      const self = this;
      const url = 'data.json?v=' + encodeURIComponent(self._cacheVersion || String(Date.now()));
      return fetch(url).then(r => {
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(d => {
        self.fitnessData = d;
        if(d.meta && d.meta.generated_at) self._cacheVersion = d.meta.generated_at;
        self.renderCalendar();
        self.computeHeatmap();
        self.computeWeightStats();
        if(self.fitnessData.meta && self.fitnessData.meta.generated_at){
          const dt = new Date(self.fitnessData.meta.generated_at);
          self.lastUpdated = dt.getHours().toString().padStart(2, '0') + ':' + dt.getMinutes().toString().padStart(2, '0');
        }
        if(self.activeTab === 'weight'){
          if(self.weightChartInstance){ self.weightChartInstance.destroy(); self.weightChartInstance = null; }
          self.renderWeightChart();
        }
        if(self.activeTab === 'stats'){
          if(self.pieChartInstance){ self.pieChartInstance.destroy(); self.pieChartInstance = null; }
          if(self.barChartInstance){ self.barChartInstance.destroy(); self.barChartInstance = null; }
          self.renderStatsCharts();
        }
      }).catch(e => {
        console.warn('数据刷新失败，已保留旧数据:', e);
        self.showToast('网络连接较弱，已展示缓存数据');
      });
    },

    prevMonth(){
      const m = this.currentDate.getMonth();
      this.currentDate = new Date(this.currentDate.getFullYear(), m - 1, 1);
      this.renderCalendar();
    },

    nextMonth(){
      const m = this.currentDate.getMonth();
      this.currentDate = new Date(this.currentDate.getFullYear(), m + 1, 1);
      this.renderCalendar();
    },

    prevYear(){
      const y = this.currentDate.getFullYear();
      this.currentDate = new Date(y - 1, this.currentDate.getMonth(), 1);
      this.computeHeatmap();
    },

    nextYear(){
      const y = this.currentDate.getFullYear();
      this.currentDate = new Date(y + 1, this.currentDate.getMonth(), 1);
      this.computeHeatmap();
    },

    goToToday(){
      this.currentDate = new Date();
      this.renderCalendar();
    },

    renderCalendar(){
      const y = this.currentDate.getFullYear(), m = this.currentDate.getMonth();
      const fd = new Date(y, m, 1).getDay(), dim = new Date(y, m + 1, 0).getDate(), today = new Date();
      this.calendarDays = [];
      for(let i = 0; i < fd; i++) this.calendarDays.push({date: null, data: null, dayNumber: null, isToday: false});
      for(let i = 1; i <= dim; i++){
        const d = new Date(y, m, i), ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(i).padStart(2, '0');
        let dd = null;
        if(this.fitnessData && this.fitnessData.days) dd = this.fitnessData.days.find(x => x.date === ds);
        this.calendarDays.push({
          dayNumber: i,
          date: ds,
          isToday: today.toDateString() === d.toDateString(),
          data: dd
        });
      }
    },

    openDetail(d){
      this.selectedDay = d;
      this.showDetail = true;
      this.showMuscleSVG = (window.innerWidth >= 768);
      let backScore = 0;
      let frontScore = 0;
      if(d && d.body_parts){
        d.body_parts.forEach(p => {
          if(/背|臀|腘/.test(p)) backScore += 2;
          if(/胸|腹|前/.test(p)) frontScore += 2;
        });
      }
      if(d && d.exercises){
        d.exercises.forEach(ex => {
          if(ex.muscles){
            ex.muscles.forEach(m => {
              if(/背|阔|菱形|大圆|竖脊|臀|腘|后束/.test(m)) backScore++;
              if(/胸|腹|股四|二头|前束/.test(m)) frontScore++;
            });
          }
        });
      }
      this.muscleViewSide = (backScore > frontScore) ? 'back' : 'front';
      if(this.showMuscleSVG){
        this.$nextTick(() => { this.updateMuscleHighlights(); });
      }
    },

    setMuscleView(side){
      this.muscleViewSide = side;
      this.updateMuscleHighlights();
    },

    mapMuscleNames(m){
      if(!m || m === 'cardio') return [];
      if(m.includes('胸')) return ['胸大肌'];
      if(m.includes('三角') || m === '中束') return ['三角肌'];
      if(m.includes('二头')) return ['肱二头肌'];
      if(m.includes('三头')) return ['肱三头肌'];
      if(m.includes('背阔') || m.includes('大圆')) return ['背阔肌'];
      if(m.includes('斜方') || m.includes('菱形')) return ['斜方肌'];
      if(m.includes('竖脊') || m.includes('下背')) return ['竖脊肌'];
      if(m.includes('腹直') || m === '腹') return ['腹直肌'];
      if(m.includes('腹斜')) return ['腹斜肌'];
      if(m.includes('股四') || m.includes('大腿前')) return ['股四头肌'];
      if(m.includes('腘绳') || m.includes('大腿后')) return ['腘绳肌'];
      if(m.includes('臀') || m.includes('外展')) return ['臀大肌'];
      if(m.includes('内收')) return ['内收肌群'];
      if(m.includes('小腿') || m.includes('提踵')) return ['小腿三头肌'];
      if(m.includes('前臂')) return ['前臂屈肌'];
      if(m.includes('胫骨')) return ['胫骨前肌'];
      return [m];
    },

    openHeatmapDetail(date, level){
      if(level === 0 || !this.fitnessData || !this.fitnessData.days) return;
      const dd = this.fitnessData.days.find(x => x.date === date);
      if(dd && dd.has_training) this.openDetail(dd);
    },

    closeDetail(){
      this.showDetail = false;
    },

    touchStart(e){
      this._touchStartY = e.touches[0].clientY;
    },

    touchMove(e){
      const content = document.querySelector('.sheet-content');
      if(content && content.scrollTop > 0) return;
      const dy = e.touches[0].clientY - this._touchStartY;
      if(dy > 50){
        this.closeDetail();
        this._touchStartY = 0;
      }
    },

    touchEnd(){
      this._touchStartY = 0;
    },

    ptrTouchStart(e){
      if(this.showDetail || this._ptrRefreshing || this.loading) return;
      if(window.scrollY > 0) return;
      this._ptrStartY = e.touches[0].clientY;
      this._ptrPulling = false;
    },

    ptrTouchMove(e){
      if(this.showDetail || this._ptrRefreshing) return;
      if(window.scrollY > 0){
        if(this._ptrPulling){ this._ptrPulling = false; this._ptrDistance = 0; }
        return;
      }
      const dy = e.touches[0].clientY - this._ptrStartY;
      if(dy <= 8){
        if(this._ptrPulling){ this._ptrPulling = false; this._ptrDistance = 0; }
        return;
      }
      this._ptrPulling = true;
      const targetDist = Math.min((dy - 8) * 0.45, 75);
      if(Math.abs(this._ptrDistance - targetDist) > 1.5){
        this._ptrDistance = targetDist;
      }
    },

    ptrTouchEnd(){
      if(!this._ptrPulling || this._ptrRefreshing) {
        this._ptrPulling = false;
        this._ptrDistance = 0;
        return;
      }
      if(this._ptrDistance >= 50){
        this._ptrRefreshing = true;
        this._ptrDistance = 40;
        const self = this;
        this.refreshData().finally(() => {
          self._ptrRefreshing = false;
          self._ptrPulling = false;
          self._ptrDistance = 0;
        });
      } else {
        this._ptrPulling = false;
        this._ptrDistance = 0;
      }
    },

    toggleMuscleSVG(){
      this.showMuscleSVG = !this.showMuscleSVG;
      if(this.showMuscleSVG) this.updateMuscleHighlights();
    },

    updateMuscleHighlights(){
      const self = this;
      this.$nextTick(() => {
        const svg = document.querySelector('.muscle-svg-container svg');
        if(!svg) return;
        svg.querySelectorAll('.muscle').forEach(el => { el.classList.remove('active'); });
        const mSet = new Set();
        if(self.selectedDay && self.selectedDay.exercises){
          self.selectedDay.exercises.forEach(ex => {
            if(ex.muscles){
              ex.muscles.forEach(m => {
                self.mapMuscleNames(m).forEach(name => mSet.add(name));
              });
            }
          });
        }
        svg.querySelectorAll('.muscle').forEach(el => {
          if(mSet.has(el.getAttribute('data-muscle'))) el.classList.add('active');
        });
      });
    },

    computeWeightStats(){
      if(!this.fitnessData || !this.fitnessData.weight_log || !this.fitnessData.weight_log.length) return;
      const d = this.fitnessData.weight_log;
      this.weightStats = {
        latest: d[d.length - 1].weight_kg,
        start: d[0].weight_kg,
        max: Math.max(...d.map(x => x.weight_kg))
      };
    },

    renderWeightChart(){
      if(!this.fitnessData || !this.fitnessData.weight_log) return;
      if(this.activeTab !== 'weight') return;

      const canvas = document.getElementById('weightChart');
      if(!canvas) return;
      const wrapper = canvas.parentElement;
      if(!wrapper || wrapper.clientWidth < 50) {
        requestAnimationFrame(() => {
          if(this.activeTab === 'weight') this.renderWeightChart();
        });
        return;
      }

      if(this.weightChartInstance){
        this.weightChartInstance.resize();
        this.weightChartInstance.update();
        return;
      }

      const existing = Chart.getChart(canvas);
      if(existing){
        existing.destroy();
      }

      const d = this.fitnessData.weight_log;
      const goal = (this.fitnessData.profile && this.fitnessData.profile.weight_kg) ? this.fitnessData.profile.weight_kg : null;
      const cs = getComputedStyle(document.documentElement);
      const accentColor = cs.getPropertyValue('--accent').trim() || '#10b981';
      const goalColor = cs.getPropertyValue('--accent-amber').trim() || '#f59e0b';
      const textColor = cs.getPropertyValue('--text-muted').trim() || '#71717a';
      const borderColor = cs.getPropertyValue('--border').trim() || 'rgba(255,255,255,0.08)';

      const ctx = canvas.getContext('2d');

      // Create vertical neon gradient glow fill
      const gradient = ctx.createLinearGradient(0, 0, 0, 220);
      gradient.addColorStop(0, 'rgba(16, 185, 129, 0.35)');
      gradient.addColorStop(0.8, 'rgba(16, 185, 129, 0.04)');
      gradient.addColorStop(1, 'rgba(16, 185, 129, 0)');

      const datasets = [
        {
          label: '体重 (kg)',
          data: d.map(x => x.weight_kg),
          borderColor: accentColor,
          backgroundColor: gradient,
          fill: true,
          tension: 0.3,
          borderWidth: 2.5,
          pointRadius: 3.5,
          pointBackgroundColor: accentColor,
          pointBorderColor: '#09090B',
          pointBorderWidth: 1.5,
          pointHoverRadius: 6,
          spanGaps: false
        }
      ];

      if(goal !== null){
        datasets.push({
          label: '目标 ' + goal + 'kg',
          data: d.map(() => goal),
          borderColor: goalColor,
          borderDash: [5, 5],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false
        });
      }

      this.weightChartInstance = new Chart(canvas, {
        type: 'line',
        data: {
          labels: d.map(x => x.date.substring(5)),
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          scales: {
            x: {
              ticks: { color: textColor, maxTicksLimit: 7, font: { size: 11 } },
              grid: { color: borderColor, drawBorder: false }
            },
            y: {
              ticks: { color: textColor, font: { size: 11 } },
              grid: { color: borderColor, drawBorder: false }
            }
          },
          plugins: {
            legend: {
              labels: { color: textColor, boxWidth: 12, font: { size: 11, weight: '600' } }
            }
          },
          animation: {
            duration: 350,
            easing: 'easeOutQuart'
          }
        }
      });
    },

    renderStatsCharts(){
      if(!this.fitnessData || !this.fitnessData.days) return;
      if(this.activeTab !== 'stats') return;

      const pieCanvas = document.getElementById('pieChart');
      const barCanvas = document.getElementById('barChart');
      if(!pieCanvas || !barCanvas) return;
      const pw = pieCanvas.parentElement;
      const bw = barCanvas.parentElement;
      if(!pw || !bw || pw.clientWidth < 50 || bw.clientWidth < 50) {
        requestAnimationFrame(() => {
          if(this.activeTab === 'stats') this.renderStatsCharts();
        });
        return;
      }

      if(this.pieChartInstance && this.barChartInstance){
        this.pieChartInstance.resize();
        this.pieChartInstance.update();
        this.barChartInstance.resize();
        this.barChartInstance.update();
        return;
      }

      const existingPie = Chart.getChart(pieCanvas);
      if(existingPie) existingPie.destroy();
      this.pieChartInstance = null;

      const existingBar = Chart.getChart(barCanvas);
      if(existingBar) existingBar.destroy();
      this.barChartInstance = null;

      const days = this.fitnessData.days.filter(d => d.has_training);
      const pc = {};
      let tp = 0;
      days.forEach(d => {
        d.body_parts.forEach(p => {
          pc[p] = (pc[p] || 0) + 1;
          tp++;
        });
      });
      const pl = [], pd = [];
      let oc = 0;
      Object.entries(pc).forEach(e => {
        const p = e[0], c = e[1];
        if(c / tp < 0.05) oc += c;
        else { pl.push(p); pd.push(c); }
      });
      if(oc > 0){ pl.push('其他'); pd.push(oc); }

      const cs = getComputedStyle(document.documentElement);
      const textColor = cs.getPropertyValue('--text-muted').trim() || '#71717a';
      const borderColor = cs.getPropertyValue('--border').trim() || 'rgba(255,255,255,0.08)';
      const accentColor = cs.getPropertyValue('--accent').trim() || '#10b981';

      // Apple Fitness Ring Style Doughnut
      this.pieChartInstance = new Chart(pieCanvas, {
        type: 'doughnut',
        data: {
          labels: pl,
          datasets: [{
            data: pd,
            backgroundColor: ['#f43f5e', '#06b6d4', '#10b981', '#f59e0b', '#a855f7', '#8b5cf6', '#64748b'],
            borderWidth: 2,
            borderColor: 'var(--card-bg)'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: textColor,
                boxWidth: 10,
                padding: 10,
                font: { size: 11, weight: '500' }
              }
            }
          },
          animation: {
            animateRotate: true,
            duration: 350,
            easing: 'easeOutQuart'
          }
        }
      });

      // Weekly training days (ISO week)
      const weeks = {};
      days.forEach(d => {
        const dt = new Date(d.date);
        const dayOfWeek = dt.getDay() || 7;
        const monday = new Date(dt);
        monday.setDate(monday.getDate() - dayOfWeek + 1);
        const ms = monday.getMonth() + 1, ds = monday.getDate();
        const wk = ms + '/' + ds;
        weeks[wk] = (weeks[wk] || 0) + 1;
      });
      const bl = Object.keys(weeks).sort(), bd = bl.map(l => weeks[l]);

      // Neon Emerald Bar Chart
      this.barChartInstance = new Chart(barCanvas, {
        type: 'bar',
        data: {
          labels: bl,
          datasets: [{
            label: '训练天数',
            data: bd,
            backgroundColor: accentColor,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              ticks: { color: textColor, maxTicksLimit: 8, maxRotation: 45, font: { size: 10 } },
              grid: { color: borderColor, drawBorder: false }
            },
            y: {
              beginAtZero: true,
              max: 7,
              ticks: { color: textColor, stepSize: 1, font: { size: 10 } },
              grid: { color: borderColor, drawBorder: false }
            }
          },
          plugins: {
            legend: { labels: { color: textColor, boxWidth: 12, font: { size: 11, weight: '600' } } }
          },
          animation: {
            duration: 350,
            easing: 'easeOutQuart'
          }
        }
      });
    },

    updateChartThemes(){
      if(this.activeTab === 'weight'){
        if(this.weightChartInstance){ this.weightChartInstance.destroy(); this.weightChartInstance = null; }
        this.renderWeightChart();
      } else if(this.activeTab === 'stats'){
        if(this.pieChartInstance){ this.pieChartInstance.destroy(); this.pieChartInstance = null; }
        if(this.barChartInstance){ this.barChartInstance.destroy(); this.barChartInstance = null; }
        this.renderStatsCharts();
      }
    },

    computeHeatmap(){
      if(!this.fitnessData || !this.fitnessData.days) return;
      const y = this.currentDate.getFullYear();
      const days = this.fitnessData.days.filter(d => d.date.startsWith(y + '-'));
      if(!days.length){
        this.heatmapData = {
          weeks: [],
          months: [],
          stats: { total: 0, recorded: 0, pct: 0, peakMonth: '—' },
          monthlyBreakdown: []
        };
        return;
      }

      const daysMap = {};
      days.forEach(d => { daysMap[d.date] = d; });

      const allDates = days.map(d => d.date).sort();
      const start = new Date(allDates[0] + 'T00:00:00');
      const end = new Date(allDates[allDates.length - 1] + 'T00:00:00');

      // 0 = Mon ... 6 = Sun
      const getMonDay = (d) => (d.getDay() + 6) % 7;

      let cur = new Date(start);
      cur.setDate(cur.getDate() - getMonDay(cur));

      let curEnd = new Date(end);
      while(getMonDay(curEnd) !== 6){
        curEnd.setDate(curEnd.getDate() + 1);
      }

      const weeks = [];
      const monthPositions = [];
      let lastMonth = -1;
      let weekIdx = 0;

      const now = new Date();
      const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

      while(cur <= curEnd){
        if(getMonDay(cur) === 0){
          weeks.push({ weekIndex: weekIdx, days: [] });
          weekIdx++;
        }
        const ds = cur.getFullYear() + '-' + String(cur.getMonth() + 1).padStart(2, '0') + '-' + String(cur.getDate()).padStart(2, '0');
        const m = cur.getMonth() + 1;

        if(getMonDay(cur) === 0 && m !== lastMonth && cur >= start){
          lastMonth = m;
          monthPositions.push({ name: m + '月', col: weekIdx });
        }

        const dData = daysMap[ds];
        let level = 0;
        let tt = ds + ' 休息';
        const inRange = (cur >= start && cur <= end);

        if(dData && dData.has_training){
          const parts = dData.body_parts || [];
          level = parts.length <= 2 ? 1 : 2;
          tt = ds + ' · 训练：' + parts.join('、');
        }

        weeks[weeks.length - 1].days.push({
          date: ds,
          level: inRange ? level : 0,
          inRange: inRange,
          isToday: (ds === todayStr),
          tooltip: inRange ? tt : '',
          hasTraining: Boolean(inRange && dData && dData.has_training)
        });

        cur.setDate(cur.getDate() + 1);
      }

      // Statistics
      const trainingDays = days.filter(d => d.has_training);
      const totalTraining = trainingDays.length;
      const totalRecorded = days.length;
      const pct = totalRecorded > 0 ? Math.round((totalTraining / totalRecorded) * 100) : 0;

      // Monthly breakdown
      const monthlyBreakdown = [];
      const monthGroups = {};
      days.forEach(d => {
        const m = d.date.substring(5, 7);
        if(!monthGroups[m]) monthGroups[m] = { total: 0, trained: 0 };
        monthGroups[m].total++;
        if(d.has_training) monthGroups[m].trained++;
      });

      let peakMonth = '';
      let peakCount = -1;

      Object.keys(monthGroups).sort().forEach(m => {
        const item = monthGroups[m];
        const mNum = parseInt(m, 10);
        const name = mNum + '月';
        const rate = Math.round((item.trained / item.total) * 100);
        if(item.trained > peakCount){
          peakCount = item.trained;
          peakMonth = name;
        }
        monthlyBreakdown.push({
          name: name,
          trained: item.trained,
          total: item.total,
          rate: rate
        });
      });

      this.heatmapData = {
        weeks: weeks,
        months: monthPositions,
        stats: {
          total: totalTraining,
          recorded: totalRecorded,
          pct: pct,
          peakMonth: peakMonth ? (peakMonth + ' (' + peakCount + '天)') : '—'
        },
        monthlyBreakdown: monthlyBreakdown
      };
    },

    getPartClass(p){
      const m = {
        '腿': 'dot-red',
        '胸': 'dot-blue',
        '背': 'dot-green',
        '肩': 'dot-yellow',
        '手臂': 'dot-purple',
        '有氧': 'dot-brown'
      };
      return m[p] || 'dot-gray';
    },

    getDietVerdict(day){
      if(!day.diet || !this.fitnessData || !this.fitnessData.profile) return {icon: '', text: '', color: '', bg: ''};
      const p = this.fitnessData.profile, cal = day.diet.total_kcal, pro = day.diet.protein_g;
      const isBulk = p.phase && p.phase.includes('增');
      const calOk = isBulk ? cal >= p.calorie_target * 0.85 : cal <= p.calorie_target * 1.15;
      const proOk = pro >= p.protein_target * 0.8;
      if(calOk && proOk) return {icon: 'check', text: '饮食达标', color: '#10b981', bg: 'rgba(16, 185, 129, 0.12)'};
      if(!calOk && !proOk) return {icon: 'x', text: '热量与蛋白未达标', color: '#f43f5e', bg: 'rgba(244, 63, 94, 0.12)'};
      if(!calOk) return {icon: 'alert', text: isBulk ? '热量不足需多吃' : '热量超标', color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.12)'};
      return {icon: 'alert', text: '蛋白质需补充', color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.12)'};
    }
  };
};
