<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="generated_at" content="">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<title>健身数据</title>
<link rel="stylesheet" href="css/fitness.css">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.x.x/dist/chart.umd.min.js"></script>
<style>
body { margin:0; background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, sans-serif; }
body.dark-mode { --bg-primary: #1A1A1A; --bg-secondary: #252525; --text-primary: #EEE; --text-secondary: #BBBBBB; --card-bg: #2A2A2A; --border: #3A3A3A; --accent: #60A5FA; --level-0: #161b22; --level-1: #0e4429; --level-2: #39d353; --muscle-bg: #333; --muscle-stroke: #1a1a1a; }
/* P2-19: Prevent tab content overlap — clip overflow and establish stacking context */
.tab-content { position: relative; overflow: hidden; }
.tab-content > [x-show] { position: relative; }
@media (min-width: 481px) {
  #fitness-app { max-width: 480px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .bottom-nav { max-width: 480px; left: 50%; transform: translateX(-50%); }
  .bottom-sheet, .bottom-sheet-backdrop { max-width: 480px; left: 50%; transform: translateX(-50%); }
}
</style>
</head>
<body>
<div id="fitness-app" x-data="fitnessApp()" x-init="init()" @touchstart.passive="ptrTouchStart($event)" @touchmove.passive="ptrTouchMove($event)" @touchend="ptrTouchEnd($event)">

  <!-- P1-14: Skeleton loading screen -->
  <div class="skeleton-container" x-show="loading">
    <div class="skeleton-header"></div>
    <div class="skeleton-grid">
      <div class="sk-box" style="animation-delay:0s"></div><div class="sk-box" style="animation-delay:0.05s"></div><div class="sk-box" style="animation-delay:0.1s"></div><div class="sk-box" style="animation-delay:0.15s"></div><div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div>
      <div class="sk-box" style="animation-delay:0.05s"></div><div class="sk-box" style="animation-delay:0.1s"></div><div class="sk-box" style="animation-delay:0.15s"></div><div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div><div class="sk-box" style="animation-delay:0.35s"></div>
      <div class="sk-box" style="animation-delay:0.1s"></div><div class="sk-box" style="animation-delay:0.15s"></div><div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div><div class="sk-box" style="animation-delay:0.35s"></div><div class="sk-box" style="animation-delay:0.4s"></div>
      <div class="sk-box" style="animation-delay:0.15s"></div><div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div><div class="sk-box" style="animation-delay:0.35s"></div><div class="sk-box" style="animation-delay:0.4s"></div><div class="sk-box" style="animation-delay:0.45s"></div>
      <div class="sk-box" style="animation-delay:0.2s"></div><div class="sk-box" style="animation-delay:0.25s"></div><div class="sk-box" style="animation-delay:0.3s"></div><div class="sk-box" style="animation-delay:0.35s"></div><div class="sk-box" style="animation-delay:0.4s"></div><div class="sk-box" style="animation-delay:0.45s"></div><div class="sk-box" style="animation-delay:0.5s"></div>
    </div>
    <div class="skeleton-bar"></div>
    <div class="skeleton-bar short"></div>
  </div>
  <div x-show="error" style="text-align:center;padding:60px 20px;color:#ef4444">
    <p style="font-size:2rem">⚠️</p><p>数据加载失败</p><p><button @click="init()" style="padding:8px 20px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--accent);cursor:pointer">重试</button></p>
  </div>

  <div x-show="!loading && !error" style="display:none">

  <!-- P1-7: Pull-to-refresh indicator -->
  <div class="ptr-indicator" :class="{ 'ptr-active': _ptrPulling, 'ptr-refreshing': _ptrRefreshing }" :style="'height:'+(_ptrDistance>0?_ptrDistance:0)+'px'">
    <div class="ptr-content" style="display:flex;align-items:center;justify-content:center;gap:6px">
      <span x-show="!_ptrRefreshing && _ptrDistance >= 60">↻</span>
      <span x-show="!_ptrRefreshing && _ptrDistance < 60">↓ 下拉刷新</span>
      <span x-show="_ptrRefreshing" class="ptr-spinner"></span>
      <span x-show="_ptrRefreshing">刷新中...</span>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:0.75rem;color:var(--text-secondary);background:var(--bg-secondary)">
    <span style="display:flex;align-items:center;gap:4px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span x-text="'更新于 ' + lastUpdated"></span>
    </span>
    <button @click="refreshData()" style="display:flex;align-items:center;gap:3px;background:none;border:1px solid var(--border);border-radius:12px;padding:2px 10px;color:var(--accent);cursor:pointer;font-size:0.75rem">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10M20.5 15a9 9 0 0 1-14.8 3.4L1 14"/></svg>
      刷新
    </button>
  </div>

  <div class="month-nav" x-show="activeTab === 'calendar' || activeTab === 'heatmap'">
    <button @click="activeTab === 'calendar' ? prevMonth() : prevYear()">&lt;</button>
    <div style="display:flex;align-items:center;gap:8px">
      <span x-text="activeTab === 'calendar' ? currentMonthDisplay : currentYearDisplay"></span>
      <button x-show="activeTab === 'calendar' && !isCurrentMonth" @click="goToToday()" style="font-size:0.75rem;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:2px 12px;cursor:pointer;min-width:auto;min-height:auto;line-height:1.5;font-weight:500">今天</button>
    </div>
    <button @click="activeTab === 'calendar' ? nextMonth() : nextYear()">&gt;</button>
  </div>

  <!-- P2-16: Tab transition wrapper -->
  <div class="tab-content">

    <!-- Calendar Tab -->
    <div x-show="activeTab === 'calendar'" x-transition.opacity.duration.200ms class="calendar-container">
      <div class="weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="days-grid">
        <template x-for="(day, i) in calendarDays" :key="i">
          <div class="day-cell" :class="{today: day.isToday, 'has-data': day.data, empty: !day.date}" @click="if(day.data) openDetail(day.data)">
            <span class="day-number" x-text="day.dayNumber"></span>
            <template x-if="day.data && day.data.has_training"><div class="dots-container">
              <template x-for="part in day.data.body_parts" :key="part">
                <span class="dot" :class="getPartClass(part)"></span>
              </template>
            </div></template>
          </div>
        </template>
      </div>
    </div>

    <!-- Heatmap Tab -->
    <div x-show="activeTab === 'heatmap'" x-transition.opacity.duration.200ms class="heatmap-container" style="display:none">
      <h3>训练热力图</h3>
      <div class="heatmap-scroll">
        <template x-if="heatmapData"><div class="heatmap-grid">
          <template x-for="(m, mi) in heatmapData.months" :key="mi">
            <div class="heatmap-month-group">
              <div class="heatmap-month-label" x-text="m.month+'月'"></div>
              <div class="heatmap-month-weeks">
                <template x-for="(w, wi) in m.weeks" :key="wi">
                  <!-- P2-18: current-week highlight -->
                  <div class="heatmap-week" :class="{'current-week': w.isCurrentWeek}">
                    <template x-for="(d, di) in w.days" :key="di">
                      <div class="heatmap-cell" :class="'level-'+d.level" :title="d.tooltip" @click="openHeatmapDetail(d.date, d.level)"></div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div></template>
      </div>
      <div class="heatmap-legend">
        <span>图例：</span>
        <div class="heatmap-cell level-0"></div><span>休息</span>
        <div class="heatmap-cell level-1"></div><span>1-2部位</span>
        <div class="heatmap-cell level-2"></div><span>3-4部位</span>
      </div>
    </div>

    <!-- Weight Tab — x-if ensures fresh canvas on every mount -->
    <template x-if="activeTab === 'weight'">
      <div x-transition.opacity.duration.150ms>
        <div class="weight-container">
          <h3>体重趋势</h3>
          <div class="chart-wrapper"><canvas id="weightChart"></canvas></div>
          <div class="weight-summary" x-show="weightStats">
            <div class="stat-box"><span>最新</span><br><b x-text="weightStats?.latest"></b>kg</div>
            <div class="stat-box"><span>起始</span><br><b x-text="weightStats?.start"></b>kg</div>
            <div class="stat-box"><span>最高</span><br><b x-text="weightStats?.max"></b>kg</div>
          </div>
        </div>
      </div>
    </template>

    <!-- Stats Tab — x-if ensures fresh canvases on every mount -->
    <template x-if="activeTab === 'stats'">
      <div x-transition.opacity.duration.150ms>
        <div class="stats-container">
          <h3>训练部位分布</h3>
          <div class="chart-wrapper pie-wrapper"><canvas id="pieChart"></canvas></div>
          <h3 style="margin-top:30px">每周训练天数</h3>
          <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
        </div>
      </div>
    </template>

  </div>

  <!-- Detail Sheet -->
  <div class="bottom-sheet-backdrop" x-show="showDetail" @click="closeDetail()" style="display:none"></div>
  <div class="bottom-sheet" :class="{open: showDetail}" @touchstart="touchStart($event)" @touchmove="touchMove($event)" @touchend="touchEnd($event)">
    <div class="sheet-handle" @click="closeDetail()"></div>
    <template x-if="selectedDay"><div class="sheet-content">
      <button class="sheet-close-btn" @click="closeDetail()">&times;</button>
      <h3 x-text="selectedDay.date + ' ' + selectedDay.weekday + (selectedDay.body_parts.length ? ' · 练' + selectedDay.body_parts.join('/') : '')"></h3>
      <p class="sheet-sub">体重 <span x-text="selectedDay.weight_kg ? selectedDay.weight_kg + 'kg' : '—'"></span></p>
      <hr>
      <div class="exercise-list" x-show="selectedDay.exercises && selectedDay.exercises.length">
        <template x-for="ex in selectedDay.exercises" :key="ex.name">
          <div class="exercise-item">
            <span class="ex-name" x-text="ex.name"></span>
            <span class="ex-sets" x-text="ex.sets + '组'"></span>
            <span class="ex-weight" x-text="ex.weight_display"></span>
          </div>
        </template>
      </div>
      <p x-show="!selectedDay.exercises || !selectedDay.exercises.length">今日休息</p>
      <hr>
      <!-- P2-22: diet diff display -->
      <div class="diet-info" x-show="selectedDay.diet">
        <span style="display:flex;align-items:center;gap:4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8Z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
          <span x-text="selectedDay.diet.total_kcal"></span>kcal (蛋白<span x-text="selectedDay.diet.protein_g"></span>g)
        </span>
        <span x-show="selectedDayDietDiff !== null" style="display:block;margin-top:4px;font-weight:600"
              :style="'color:'+(selectedDayDietDiff>0?'#ef4444':selectedDayDietDiff<0?'#10b981':'var(--text-secondary)')"
              x-text="selectedDayDietDiff === 0 ? '✅ 热量刚好达标' : (selectedDayDietDiff > 0 ? '超' : '差') + Math.abs(selectedDayDietDiff) + 'kcal'"></span>
        <span x-show="fitnessData.profile" style="display:block;margin-top:4px;font-size:0.85rem" 
              :style="getDietVerdict(selectedDay).style" 
              x-text="getDietVerdict(selectedDay).text"></span>
      </div>
      <div class="muscle-view-toggle" x-show="selectedDay.exercises && selectedDay.exercises.length">
        <button class="muscle-btn" @click="toggleMuscleSVG()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 4h3a2 2 0 0 1 2 2v1"/><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M4 16v2a2 2 0 0 0 2 2h2"/><path d="M20 16h-3"/><circle cx="12" cy="12" r="3"/></svg>
          肌肉图解 ▼
        </button>
      </div>
      <div class="muscle-svg-container" x-show="showMuscleSVG" x-html="muscleSvgContent" style="display:none"></div>
    </div></template>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav" :style="showDetail ? 'pointer-events:none;opacity:0.4' : ''">
    <div class="nav-item" :class="{active:activeTab==='calendar'}" @click="switchTab('calendar')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>日历</span>
    </div>
    <div class="nav-item" :class="{active:activeTab==='heatmap'}" @click="switchTab('heatmap')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="15" width="4" height="8" rx="1"/><rect x="8" y="12" width="4" height="11" rx="1"/><rect x="15" y="7" width="4" height="16" rx="1"/></svg>
      <span>热力</span>
    </div>
    <div class="nav-item" :class="{active:activeTab==='weight'}" @click="switchTab('weight')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 17 9 11 13 15 21 7"/></svg>
      <span>体重</span>
    </div>
    <div class="nav-item" :class="{active:activeTab==='stats'}" @click="switchTab('stats')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><path d="M2 12h20"/></svg>
      <span>统计</span>
    </div>
  </div>

</div>

</div>

<script>
window.fitnessApp = function(){
  return {
    activeTab:'calendar', showDetail:false, selectedDay:null, currentDate:new Date(),
    calendarDays:[], fitnessData:null, showMuscleSVG:false, muscleSvgContent:'',
    weightChartInstance:null, pieChartInstance:null, barChartInstance:null,
    heatmapData:null, weightStats:null, loading:true, error:false, lastUpdated:'—', _touchStartY:0,
    _ptrPulling:false, _ptrDistance:0, _ptrRefreshing:false, _ptrStartY:0, _svgCached:false,
    _weightAnimPlayed:false, _statsAnimPlayed:false,
    // P2-20: cache buster from meta.generated_at
    _cacheVersion:'',
    _getDataUrl(){
      return 'data.json?v=' + encodeURIComponent(this._cacheVersion || String(Date.now()));
    },
    // P2-22: diet diff getter
    get selectedDayDietDiff(){
      if(!this.selectedDay||!this.selectedDay.diet||!this.fitnessData||!this.fitnessData.profile) return null;
      const target = this.fitnessData.profile.calorie_target;
      if(!target) return null;
      return this.selectedDay.diet.total_kcal - target;
    },
    get currentMonthDisplay(){ return this.currentDate.getFullYear()+'年 '+(this.currentDate.getMonth()+1)+'月' },
    get currentYearDisplay(){ return this.currentDate.getFullYear()+'年' },
    get isCurrentMonth(){ const now=new Date(); return this.currentDate.getFullYear()===now.getFullYear() && this.currentDate.getMonth()===now.getMonth() },
    async init(){
      this.loading=true; this.error=false;
      try{ const r=await fetch(this._getDataUrl()); this.fitnessData=await r.json() } catch(e){ this.error=true; this.loading=false; return }
      // P2-20: store generated_at for cache busting
      if(this.fitnessData.meta&&this.fitnessData.meta.generated_at){
        this._cacheVersion = this.fitnessData.meta.generated_at;
        const d=new Date(this.fitnessData.meta.generated_at);
        this.lastUpdated=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
      }
      this.loading=false;
      // P1-15: SVG cache — fetch body-outline.svg once only
      if(!this._svgCached){
        try{ const s=await fetch('img/body-outline.svg'); this.muscleSvgContent=await s.text(); this._svgCached=true } catch(e){}
      }
      this.renderCalendar(); this.computeHeatmap(); this.computeWeightStats();
      // P1-10: Background tab power saving — visibilitychange
      const self=this;
      if(!this._visHandler){
        this._visHandler=()=>{
          if(document.hidden){
            if(self._refreshTimer){ clearInterval(self._refreshTimer); self._refreshTimer=null }
          } else {
            self.refreshData();
            if(!self._refreshTimer) self._refreshTimer=setInterval(()=>{ self.refreshData() }, 1800000);
          }
        };
        document.addEventListener('visibilitychange', this._visHandler);
      }
      // Auto-refresh every 30 min
      if(this._refreshTimer) clearInterval(this._refreshTimer);
      this._refreshTimer=setInterval(()=>{ self.refreshData() }, 1800000);
      // P1-11: Chart.js debounced resize
      if(!this._resizeHandler){
        let debounceTimer=null;
        this._resizeHandler=()=>{
          if(debounceTimer) clearTimeout(debounceTimer);
          debounceTimer=setTimeout(()=>{
            if(self.weightChartInstance) self.weightChartInstance.resize();
            if(self.pieChartInstance) self.pieChartInstance.resize();
            if(self.barChartInstance) self.barChartInstance.resize();
          }, 200);
        };
        window.addEventListener('resize', this._resizeHandler);
      }
    },
    // P2-19: switchTab — destroy before DOM change, then recreate after layout is complete
    switchTab(t){
      const prev = this.activeTab;
      if(prev === t) return; // no-op for same tab
      // Always destroy chart instances BEFORE activeTab changes (before Alpine removes DOM)
      if(prev === 'weight' && this.weightChartInstance) {
        this.weightChartInstance.destroy();
        this.weightChartInstance = null;
      }
      if(prev === 'stats') {
        if(this.pieChartInstance) { this.pieChartInstance.destroy(); this.pieChartInstance = null; }
        if(this.barChartInstance) { this.barChartInstance.destroy(); this.barChartInstance = null; }
      }
      this.activeTab = t;
      // $nextTick ensures Alpine's x-if DOM creation runs before we try to find the canvas.
      // Double requestAnimationFrame ensures the browser has completed at least one full
      // layout cycle, so the canvas element has non-zero dimensions before Chart.js touches it.
      this.$nextTick(() => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if(t === 'weight') this.renderWeightChart();
            if(t === 'stats') this.renderStatsCharts();
          });
        });
      });
    },
    refreshData:function(){
      const self=this;
      // P2-20: use cached generated_at for cache busting
      const url = 'data.json?v=' + encodeURIComponent(self._cacheVersion || String(Date.now()));
      return fetch(url).then(r=>r.json()).then(d=>{
        self.fitnessData=d;
        // P2-20: update cache version if changed
        if(d.meta&&d.meta.generated_at) self._cacheVersion = d.meta.generated_at;
        self.renderCalendar(); self.computeHeatmap(); self.computeWeightStats();
        if(self.fitnessData.meta&&self.fitnessData.meta.generated_at){
          const dt=new Date(self.fitnessData.meta.generated_at);
          self.lastUpdated=dt.getHours().toString().padStart(2,'0')+':'+dt.getMinutes().toString().padStart(2,'0');
        }
        // P2-19: update charts instead of destroy+recreate
        if(self.activeTab==='weight') self.renderWeightChart();
        if(self.activeTab==='stats') self.renderStatsCharts();
      }).catch(e=>{
        // P2-24: set error state on fetch failure
        console.error('数据刷新失败:', e);
        self.error = true;
      });
    },
    prevMonth(){ const m=this.currentDate.getMonth(); this.currentDate=new Date(this.currentDate.getFullYear(),m-1,1); this.renderCalendar() },
    nextMonth(){ const m=this.currentDate.getMonth(); this.currentDate=new Date(this.currentDate.getFullYear(),m+1,1); this.renderCalendar() },
    prevYear(){ const y=this.currentDate.getFullYear(); this.currentDate=new Date(y-1,this.currentDate.getMonth(),1); this.computeHeatmap() },
    nextYear(){ const y=this.currentDate.getFullYear(); this.currentDate=new Date(y+1,this.currentDate.getMonth(),1); this.computeHeatmap() },
    goToToday(){ this.currentDate=new Date(); this.renderCalendar() },
    renderCalendar(){
      const y=this.currentDate.getFullYear(), m=this.currentDate.getMonth();
      const fd=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), today=new Date();
      this.calendarDays=[];
      for(let i=0;i<fd;i++) this.calendarDays.push({date:null, data:null, dayNumber:null, isToday:false});
      for(let i=1;i<=dim;i++){
        const d=new Date(y,m,i), ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
        let dd=null;
        if(this.fitnessData&&this.fitnessData.days) dd=this.fitnessData.days.find(x=>x.date===ds);
        this.calendarDays.push({dayNumber:i,date:ds,isToday:today.toDateString()===d.toDateString(),data:dd});
      }
    },
    openDetail(d){ this.selectedDay=d; this.showDetail=true; this.showMuscleSVG=false },
    openHeatmapDetail(date, level){
      if(level===0 || !this.fitnessData || !this.fitnessData.days) return;
      const dd=this.fitnessData.days.find(x=>x.date===date);
      if(dd && dd.has_training) this.openDetail(dd);
    },
    closeDetail(){ this.showDetail=false },
    touchStart(e){ this._touchStartY=e.touches[0].clientY },
    touchMove(e){
      const dy=e.touches[0].clientY-this._touchStartY;
      if(dy>30){ this.closeDetail(); this._touchStartY=0 }
    },
    touchEnd(e){ this._touchStartY=0 },
    // P1-7: Pull-to-refresh touch handlers
    ptrTouchStart(e){
      // Only trigger when at top, not in detail mode, not already pulling
      if(this.showDetail || this._ptrRefreshing || this.loading) return;
      if(window.scrollY > 0 && document.documentElement.scrollTop > 0) return;
      this._ptrStartY = e.touches[0].clientY;
      this._ptrPulling = true;
    },
    ptrTouchMove(e){
      if(!this._ptrPulling || this._ptrRefreshing) return;
      const dy = e.touches[0].clientY - this._ptrStartY;
      if(dy <= 0) { this._ptrDistance = 0; return; }
      // Dampen pull distance
      this._ptrDistance = Math.min(dy * 0.4, 80);
    },
    ptrTouchEnd(e){
      if(!this._ptrPulling || this._ptrRefreshing) { this._ptrPulling = false; this._ptrDistance = 0; return; }
      if(this._ptrDistance >= 60){
        // Trigger refresh
        this._ptrRefreshing = true;
        const self = this;
        this.refreshData().then(()=>{
          self._ptrRefreshing = false;
          self._ptrPulling = false;
          self._ptrDistance = 0;
        });
      } else {
        this._ptrPulling = false;
        this._ptrDistance = 0;
      }
    },
    toggleMuscleSVG(){ this.showMuscleSVG=!this.showMuscleSVG; if(this.showMuscleSVG) this.updateMuscleHighlights() },
    updateMuscleHighlights(){
      const self=this;
      this.$nextTick(()=>{
        const svg=document.querySelector('.muscle-svg-container svg'); if(!svg) return;
        svg.querySelectorAll('.muscle').forEach(el=>{ el.classList.remove('active') });
        const mSet=new Set();
        if(self.selectedDay&&self.selectedDay.exercises) self.selectedDay.exercises.forEach(ex=>{
          if(ex.muscles) ex.muscles.forEach(m=>{
            let mapped=m; if(m.includes('三角')) mapped='三角肌'; if(m.includes('胸大')) mapped='胸大肌';
            if(m!=='菱形肌'&&m!=='大圆肌') mSet.add(mapped);
          });
        });
        svg.querySelectorAll('.muscle').forEach(el=>{ if(mSet.has(el.getAttribute('data-muscle'))) el.classList.add('active') });
      });
    },
    computeWeightStats(){
      if(!this.fitnessData||!this.fitnessData.weight_log||!this.fitnessData.weight_log.length) return;
      const d=this.fitnessData.weight_log;
      this.weightStats={latest:d[d.length-1].weight_kg, start:d[0].weight_kg, max:Math.max(...d.map(x=>x.weight_kg))};
    },
    // P2-19: renderWeightChart — canvas lifecycle managed by x-if (fresh element each mount)
    renderWeightChart(){
      if(!this.fitnessData||!this.fitnessData.weight_log) return;
      const d=this.fitnessData.weight_log;
      const goal=((this.fitnessData.profile||{}).weight_kg)||68;
      // If chart already exists (refreshData update path), update data in-place
      if(this.weightChartInstance){
        this.weightChartInstance.data.labels = d.map(x=>x.date.substring(5));
        this.weightChartInstance.data.datasets[0].data = d.map(x=>x.weight_kg);
        this.weightChartInstance.data.datasets[1].data = d.map(()=>goal);
        this.weightChartInstance.update('none'); // skip animation for data updates
        return;
      }
      // Fresh canvas — guaranteed to exist with non-zero dimensions thanks to x-if + double rAF
      const canvas=document.getElementById('weightChart');
      if(!canvas) return;
      const ctx=canvas.getContext('2d');
      const animCfg = this._weightAnimPlayed ? false : {duration:300,easing:'easeOutQuart'};
      if(!this._weightAnimPlayed) this._weightAnimPlayed = true;
      this.weightChartInstance=new Chart(ctx,{
        type:'line',
        data:{
          labels:d.map(x=>x.date.substring(5)),
          datasets:[
            {label:'体重',data:d.map(x=>x.weight_kg),borderColor:'#3b82f6',spanGaps:false,tension:0.1},
            {label:'目标'+goal+'kg',data:d.map(()=>goal),borderColor:'#10b981',borderDash:[5,5],pointRadius:0}
          ]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          scales:{x:{ticks:{maxTicksLimit:7}}},
          animation:animCfg
        }
      });
    },
    // P2-19: renderStatsCharts — canvas lifecycle managed by x-if (fresh elements each mount)
    renderStatsCharts(){
      if(!this.fitnessData||!this.fitnessData.days) return;
      const days=this.fitnessData.days.filter(d=>d.has_training);
      const pc={}; let tp=0; days.forEach(d=>{ d.body_parts.forEach(p=>{ pc[p]=(pc[p]||0)+1; tp++ }) });
      const pl=[], pd=[]; let oc=0;
      Object.entries(pc).forEach(e=>{ const p=e[0],c=e[1]; if(c/tp<0.05) oc+=c; else{pl.push(p);pd.push(c)} });
      if(oc>0){pl.push('其他');pd.push(oc)}
      // Pie chart — update if exists, create if not (x-if gives fresh canvas on each mount)
      if(this.pieChartInstance){
        this.pieChartInstance.data.labels = pl;
        this.pieChartInstance.data.datasets[0].data = pd;
        this.pieChartInstance.update('none'); // skip animation for data updates
      } else {
        const pieCanvas=document.getElementById('pieChart');
        if(pieCanvas){
          const cp=pieCanvas.getContext('2d');
          const animCfg = this._statsAnimPlayed ? false : {animateRotate:true,duration:300,easing:'easeOutQuart'};
          this.pieChartInstance=new Chart(cp,{type:'pie',data:{labels:pl,datasets:[{data:pd,backgroundColor:['#ef4444','#3b82f6','#10b981','#eab308','#a855f7','#8b5cf6','#94a3b8']}]},options:{responsive:true,maintainAspectRatio:false,
            plugins:{legend:{position:'bottom',labels:{color:getComputedStyle(document.body).getPropertyValue('--text-secondary')||'#666'}}},
            animation:animCfg}});
        }
      }
      // Weekly training days (ISO week grouping)
      const weeks={};
      days.forEach(d=>{
        const dt=new Date(d.date);
        // Get Monday of this week
        const dayOfWeek=dt.getDay()||7; // Sunday=7
        const monday=new Date(dt);
        monday.setDate(monday.getDate()-dayOfWeek+1);
        const ms=monday.getMonth()+1, ds=monday.getDate();
        const wk=ms+'/'+ds; // e.g. "5/18" for week starting May 18
        weeks[wk]=(weeks[wk]||0)+1;
      });
      const bl=Object.keys(weeks).sort(), bd=bl.map(l=>weeks[l]);
      // Bar chart — update if exists, create if not
      if(this.barChartInstance){
        this.barChartInstance.data.labels = bl;
        this.barChartInstance.data.datasets[0].data = bd;
        this.barChartInstance.update('none'); // skip animation for data updates
      } else {
        const barCanvas=document.getElementById('barChart');
        if(barCanvas){
          const cb=barCanvas.getContext('2d');
          // P2-17: maxTicksLimit + maxRotation for x-axis label anti-overlap
          this.barChartInstance=new Chart(cb,{type:'bar',data:{labels:bl,datasets:[{label:'训练天数',data:bd,backgroundColor:'#3b82f6'}]},options:{responsive:true,maintainAspectRatio:false,
            scales:{x:{ticks:{maxTicksLimit:8,maxRotation:45}},y:{beginAtZero:true,max:7}},
            animation:this._statsAnimPlayed?false:{duration:300,easing:'easeOutQuart'}}});
        }
      }
      this._statsAnimPlayed = true;
    },
    computeHeatmap(){
      if(!this.fitnessData||!this.fitnessData.days) return;
      const y=this.currentDate.getFullYear();
      const days=this.fitnessData.days.filter(d=>d.date.startsWith(y+''));
      if(!days.length){this.heatmapData={months:[]};return}
      const dm={}; days.forEach(d=>{ if(d.has_training) dm[d.date]={count:d.body_parts.length,parts:d.body_parts} });
      this.heatmapData={months:[]};
      for(let m=1;m<=12;m++){
        const has=days.some(d=>d.date.startsWith(y+'-'+String(m).padStart(2,'0')));
        if(!has) continue;
        const md={month:m,weeks:[]}, s=new Date(y,m-1,1), e=new Date(y,m,0);
        let c=new Date(s);
        c.setDate(c.getDate()-c.getDay());
        let wi=-1;
        while(c<=e||c.getDay()!==0){
          if(c.getDay()===0){md.weeks.push({days:[],isCurrentWeek:false});wi++}
          const ds=c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');
          const data=dm[ds]; let level=0; let tt=ds+' 无训练';
          if(data){level=data.count<=2?1:2; tt=ds+' '+data.parts.join('、')}
          if(c.getMonth()!==(m-1)){level=0;tt=''}
          md.weeks[wi].days.push({date:ds,level:level,tooltip:tt});
          c.setDate(c.getDate()+1);
        }
        this.heatmapData.months.push(md);
      }
      // P2-18: mark current week for highlighting
      const todayStr = new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0');
      for(const month of this.heatmapData.months){
        for(const week of month.weeks){
          if(week.days.some(d=>d.date===todayStr)){
            week.isCurrentWeek = true;
            break;
          }
        }
      }
    },
    getPartClass(p){
      const m={腿:'dot-red',胸:'dot-blue',背:'dot-green',肩:'dot-yellow',手臂:'dot-purple',有氧:'dot-brown'};
      return m[p]||'dot-gray';
    },
    getDietVerdict(day){
      if(!day.diet||!this.fitnessData||!this.fitnessData.profile) return {text:'',style:''};
      const p=this.fitnessData.profile, cal=day.diet.total_kcal, pro=day.diet.protein_g;
      const isBulk=p.phase.includes('增');
      const calOk=isBulk?cal>=p.calorie_target*0.85:cal<=p.calorie_target*1.15;
      const proOk=pro>=p.protein_target*0.8;
      if(calOk&&proOk) return {text:'✅ 饮食达标',style:'color:#10b981'};
      if(!calOk&&!proOk) return {text:'❌ 热量和蛋白均不足',style:'color:#ef4444'};
      if(!calOk) return {text:isBulk?'⚠️ 热量不足，需多吃':'⚠️ 热量超标',style:'color:#f59e0b'};
      return {text:'⚠️ 蛋白质不足，需补充',style:'color:#f59e0b'};
    }
  };
};
</script>
