<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>健身数据</title>
<link rel="stylesheet" href="css/fitness.css">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.x.x/dist/chart.umd.min.js"></script>
<style>
body { margin:0; background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, sans-serif; }
body.dark-mode { --bg-primary: #1A1A1A; --bg-secondary: #252525; --text-primary: #EEE; --text-secondary: #AAA; --card-bg: #2A2A2A; --border: #3A3A3A; --accent: #60A5FA; --level-0: #161b22; --level-1: #0e4429; --level-2: #39d353; --muscle-bg: #333; --muscle-stroke: #1a1a1a; }
</style>
</head>
<body>
<div id="fitness-app" x-data="fitnessApp()" x-init="init()">

  <div x-show="loading" style="text-align:center;padding:60px 20px;color:var(--text-secondary)">
    <p style="font-size:2rem">🏋️</p><p>加载中...</p>
  </div>
  <div x-show="error" style="text-align:center;padding:60px 20px;color:#ef4444">
    <p style="font-size:2rem">⚠️</p><p>数据加载失败</p><p><button @click="init()" style="padding:8px 20px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:var(--accent);cursor:pointer">重试</button></p>
  </div>

  <div x-show="!loading && !error" style="display:none">

  <div class="month-nav" x-show="activeTab === 'calendar' || activeTab === 'heatmap'">
    <button @click="activeTab === 'calendar' ? prevMonth() : prevYear()">&lt;</button>
    <span x-text="activeTab === 'calendar' ? currentMonthDisplay : currentYearDisplay"></span>
    <button @click="activeTab === 'calendar' ? nextMonth() : nextYear()">&gt;</button>
  </div>

  <div class="tab-content">

    <!-- Calendar Tab -->
    <div x-show="activeTab === 'calendar'" class="calendar-container">
      <div class="weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="days-grid">
        <template x-for="(day, i) in calendarDays" :key="i">
          <div class="day-cell" :class="{today: day.isToday, 'has-data': day.data, empty: !day.date}" @click="if(day.data) openDetail(day.data)">
            <span class="day-number" x-text="day.dayNumber"></span>
            <template x-if="day.data && day.data.has_training"><div class="dots-container">
              <template x-for="part in day.data.body_parts" :key="part">
                <span class="dot" :class="getPartClass(part)"></span>
              </template>
            </div></template>
          </div>
        </template>
      </div>
    </div>

    <!-- Heatmap Tab -->
    <div x-show="activeTab === 'heatmap'" class="heatmap-container" style="display:none">
      <h3>训练热力图</h3>
      <div class="heatmap-scroll">
        <template x-if="heatmapData"><div class="heatmap-grid">
          <template x-for="(m, mi) in heatmapData.months" :key="mi">
            <div class="heatmap-month-group">
              <div class="heatmap-month-label" x-text="m.month+'月'"></div>
              <div class="heatmap-month-weeks">
                <template x-for="(w, wi) in m.weeks" :key="wi">
                  <div class="heatmap-week">
                    <template x-for="(d, di) in w.days" :key="di">
                      <div class="heatmap-cell" :class="'level-'+d.level" :title="d.tooltip"></div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div></template>
      </div>
      <div class="heatmap-legend">
        <span>图例：</span>
        <div class="heatmap-cell level-0"></div><span>休息</span>
        <div class="heatmap-cell level-1"></div><span>1-2部位</span>
        <div class="heatmap-cell level-2"></div><span>3-4部位</span>
      </div>
    </div>

    <!-- Weight Tab -->
    <div x-show="activeTab === 'weight'" class="weight-container" style="display:none">
      <h3>体重趋势</h3>
      <div class="chart-wrapper"><canvas id="weightChart"></canvas></div>
      <div class="weight-summary" x-show="weightStats">
        <div class="stat-box"><span>最新</span><br><b x-text="weightStats?.latest"></b>kg</div>
        <div class="stat-box"><span>起始</span><br><b x-text="weightStats?.start"></b>kg</div>
        <div class="stat-box"><span>最高</span><br><b x-text="weightStats?.max"></b>kg</div>
      </div>
    </div>

    <!-- Stats Tab -->
    <div x-show="activeTab === 'stats'" class="stats-container" style="display:none">
      <h3>训练部位分布</h3>
      <div class="chart-wrapper pie-wrapper"><canvas id="pieChart"></canvas></div>
      <h3 style="margin-top:30px">每周训练天数</h3>
      <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
    </div>

  </div>

  <!-- Detail Sheet -->
  <div class="bottom-sheet-backdrop" x-show="showDetail" @click="closeDetail()" style="display:none"></div>
  <div class="bottom-sheet" :class="{open: showDetail}">
    <div class="sheet-handle" @click="closeDetail()"></div>
    <template x-if="selectedDay"><div class="sheet-content">
      <h3 x-text="selectedDay.date + ' ' + selectedDay.weekday + (selectedDay.body_parts.length ? ' · 练' + selectedDay.body_parts.join('/') : '')"></h3>
      <p class="sheet-sub">体重 <span x-text="selectedDay.weight_kg ? selectedDay.weight_kg + 'kg' : '—'"></span></p>
      <hr>
      <div class="exercise-list" x-show="selectedDay.exercises && selectedDay.exercises.length">
        <template x-for="ex in selectedDay.exercises" :key="ex.name">
          <div class="exercise-item">
            <span class="ex-name" x-text="ex.name"></span>
            <span class="ex-sets" x-text="ex.sets + '组'"></span>
            <span class="ex-weight" x-text="ex.weight_display"></span>
          </div>
        </template>
      </div>
      <p x-show="!selectedDay.exercises || !selectedDay.exercises.length">今日休息</p>
      <hr>
      <div class="diet-info" x-show="selectedDay.diet">🍽️ <span x-text="selectedDay.diet.total_kcal"></span>kcal (蛋白<span x-text="selectedDay.diet.protein_g"></span>g)</div>
      <div class="muscle-view-toggle" x-show="selectedDay.exercises && selectedDay.exercises.length">
        <button class="muscle-btn" @click="toggleMuscleSVG()">🦴 肌肉图解 ▼</button>
      </div>
      <div class="muscle-svg-container" x-show="showMuscleSVG" x-html="muscleSvgContent" style="display:none"></div>
    </div></template>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item" :class="{active:activeTab==='calendar'}" @click="switchTab('calendar')">📅 日历</div>
    <div class="nav-item" :class="{active:activeTab==='heatmap'}" @click="switchTab('heatmap')">🔥 热力</div>
    <div class="nav-item" :class="{active:activeTab==='weight'}" @click="switchTab('weight')">📈 体重</div>
    <div class="nav-item" :class="{active:activeTab==='stats'}" @click="switchTab('stats')">📊 统计</div>
  </div>

</div>

</div>

<script>
window.fitnessApp = function(){
  return {
    activeTab:'calendar', showDetail:false, selectedDay:null, currentDate:new Date(),
    calendarDays:[], fitnessData:null, showMuscleSVG:false, muscleSvgContent:'',
    weightChartInstance:null, pieChartInstance:null, barChartInstance:null,
    heatmapData:null, weightStats:null, loading:true, error:false,
    get currentMonthDisplay(){ return this.currentDate.getFullYear()+'年 '+(this.currentDate.getMonth()+1)+'月' },
    get currentYearDisplay(){ return this.currentDate.getFullYear()+'年' },
    async init(){
      this.loading=true; this.error=false;
      try{ const r=await fetch('data.json?v=3'); this.fitnessData=await r.json() } catch(e){ this.error=true; this.loading=false; return }
      this.loading=false;
      try{ const s=await fetch('img/body-outline.svg'); this.muscleSvgContent=await s.text() } catch(e){}
      this.renderCalendar(); this.computeHeatmap(); this.computeWeightStats();
    },
    switchTab(t){ this.activeTab=t; this.$nextTick(()=>{ if(t==='weight')this.renderWeightChart(); if(t==='stats')this.renderStatsCharts() }) },
    prevMonth(){ var m=this.currentDate.getMonth(); this.currentDate=new Date(this.currentDate.getFullYear(),m-1,1); this.renderCalendar() },
    nextMonth(){ var m=this.currentDate.getMonth(); this.currentDate=new Date(this.currentDate.getFullYear(),m+1,1); this.renderCalendar() },
    prevYear(){ var y=this.currentDate.getFullYear(); this.currentDate=new Date(y-1,this.currentDate.getMonth(),1); this.computeHeatmap() },
    nextYear(){ var y=this.currentDate.getFullYear(); this.currentDate=new Date(y+1,this.currentDate.getMonth(),1); this.computeHeatmap() },
    renderCalendar(){
      var y=this.currentDate.getFullYear(), m=this.currentDate.getMonth();
      var fd=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), today=new Date();
      this.calendarDays=[];
      for(var i=0;i<fd;i++) this.calendarDays.push({date:null, data:null, dayNumber:null, isToday:false});
      for(var i=1;i<=dim;i++){
        var d=new Date(y,m,i), ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
        var dd=null;
        if(this.fitnessData&&this.fitnessData.days) dd=this.fitnessData.days.find(function(x){return x.date===ds});
        this.calendarDays.push({dayNumber:i,date:ds,isToday:today.toDateString()===d.toDateString(),data:dd});
      }
    },
    openDetail(d){ this.selectedDay=d; this.showDetail=true; this.showMuscleSVG=false },
    closeDetail(){ this.showDetail=false },
    toggleMuscleSVG(){ this.showMuscleSVG=!this.showMuscleSVG; if(this.showMuscleSVG) this.updateMuscleHighlights() },
    updateMuscleHighlights(){
      var self=this;
      this.$nextTick(function(){
        var svg=document.querySelector('.muscle-svg-container svg'); if(!svg) return;
        svg.querySelectorAll('.muscle').forEach(function(el){ el.classList.remove('active') });
        var mSet=new Set();
        if(self.selectedDay&&self.selectedDay.exercises) self.selectedDay.exercises.forEach(function(ex){
          if(ex.muscles) ex.muscles.forEach(function(m){
            var mapped=m; if(m.includes('三角')) mapped='三角肌'; if(m.includes('胸大')) mapped='胸大肌';
            if(m!=='菱形肌'&&m!=='大圆肌') mSet.add(mapped);
          });
        });
        svg.querySelectorAll('.muscle').forEach(function(el){ if(mSet.has(el.getAttribute('data-muscle'))) el.classList.add('active') });
      });
    },
    computeWeightStats(){
      if(!this.fitnessData||!this.fitnessData.weight_log||!this.fitnessData.weight_log.length) return;
      var d=this.fitnessData.weight_log;
      this.weightStats={latest:d[d.length-1].weight_kg, start:d[0].weight_kg, max:Math.max.apply(null,d.map(function(x){return x.weight_kg}))};
    },
    renderWeightChart(){
      if(!this.fitnessData||!this.fitnessData.weight_log) return;
      var ctx=document.getElementById('weightChart'); if(!ctx) return;
      if(this.weightChartInstance) this.weightChartInstance.destroy();
      var d=this.fitnessData.weight_log;
      this.weightChartInstance=new Chart(ctx,{type:'line', data:{labels:d.map(function(x){return x.date.substring(5)}),datasets:[
        {label:'体重',data:d.map(function(x){return x.weight_kg}),borderColor:'#3b82f6',spanGaps:false,tension:0.1},
        {label:'目标68kg',data:d.map(function(){return 68}),borderColor:'#10b981',borderDash:[5,5],pointRadius:0}
      ]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{maxTicksLimit:7}}}}});
    },
    renderStatsCharts(){
      if(!this.fitnessData||!this.fitnessData.days) return;
      var days=this.fitnessData.days.filter(function(d){return d.has_training});
      var pc={}, tp=0; days.forEach(function(d){ d.body_parts.forEach(function(p){ pc[p]=(pc[p]||0)+1; tp++ }) });
      var pl=[], pd=[], oc=0;
      Object.entries(pc).forEach(function(e){ var p=e[0],c=e[1]; if(c/tp<0.05) oc+=c; else{pl.push(p);pd.push(c)} });
      if(oc>0){pl.push('其他');pd.push(oc)}
      var cp=document.getElementById('pieChart');
      if(this.pieChartInstance) this.pieChartInstance.destroy();
      this.pieChartInstance=new Chart(cp,{type:'pie',data:{labels:pl,datasets:[{data:pd,backgroundColor:['#ef4444','#3b82f6','#10b981','#eab308','#a855f7','#8b5cf6','#94a3b8']}]},options:{responsive:true,maintainAspectRatio:false}});
      // Weekly training days (ISO week grouping)
      var weeks={};
      days.forEach(function(d){
        var dt=new Date(d.date);
        // Get Monday of this week
        var dayOfWeek=dt.getDay()||7; // Sunday=7
        var monday=new Date(dt);
        monday.setDate(monday.getDate()-dayOfWeek+1);
        var ms=monday.getMonth()+1, ds=monday.getDate();
        var wk=ms+'/'+ds; // e.g. "5/18" for week starting May 18
        weeks[wk]=(weeks[wk]||0)+1;
      });
      var bl=Object.keys(weeks).sort(), bd=bl.map(function(l){return weeks[l]});
      var cb=document.getElementById('barChart');
      if(this.barChartInstance) this.barChartInstance.destroy();
      this.barChartInstance=new Chart(cb,{type:'bar',data:{labels:bl,datasets:[{label:'训练天数',data:bd,backgroundColor:'#3b82f6'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:7}}}});
    },
    computeHeatmap(){
      if(!this.fitnessData||!this.fitnessData.days) return;
      var y=this.currentDate.getFullYear();
      var days=this.fitnessData.days.filter(function(d){return d.date.startsWith(y+'')});
      if(!days.length){this.heatmapData={months:[]};return}
      var dm={}; days.forEach(function(d){ if(d.has_training) dm[d.date]={count:d.body_parts.length,parts:d.body_parts} });
      this.heatmapData={months:[]};
      for(var m=1;m<=12;m++){
        var has=days.some(function(d){return d.date.startsWith(y+'-'+String(m).padStart(2,'0'))});
        if(!has) continue;
        var md={month:m,weeks:[]}, s=new Date(y,m-1,1), e=new Date(y,m,0), c=new Date(s);
        c.setDate(c.getDate()-c.getDay());
        var wi=-1;
        while(c<=e||c.getDay()!==0){
          if(c.getDay()===0){md.weeks.push({days:[]});wi++}
          var ds=c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');
          var data=dm[ds], level=0, tt=ds+' 无训练';
          if(data){level=data.count<=2?1:2; tt=ds+' '+data.parts.join('、')}
          if(c.getMonth()!==(m-1)){level=0;tt=''}
          md.weeks[wi].days.push({date:ds,level:level,tooltip:tt});
          c.setDate(c.getDate()+1);
        }
        this.heatmapData.months.push(md);
      }
    },
    getPartClass:function(p){
      var m={腿:'dot-red',胸:'dot-blue',背:'dot-green',肩:'dot-yellow',手臂:'dot-purple',有氧:'dot-brown'};
      return m[p]||'dot-gray';
    }
  };
};
</script>
</body>
</html>
